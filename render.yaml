# Render blueprint for the demo.
#
# Create it from this file with Render's "New > Blueprint" and point it at the
# repository. Three variables are marked `sync: false`, which means Render asks
# for them instead of reading them from here — they are the two credentials and
# the site's own address, and none of the three belongs in a repository.
#
# This runs on the free instance type, which means two things worth knowing
# before anyone is shown the link:
#
#   - The service sleeps after about 15 minutes with no traffic, and the next
#     visitor waits roughly a minute while it wakes. Nothing is broken; it is
#     just slow to answer the first knock.
#   - There is no disk. The database and the uploads live on the container's
#     own filesystem, which is rebuilt from the image whenever the service
#     restarts — so anything added through the admin panel lasts until then and
#     no longer. For showing the site that is fine, and it has a useful side
#     effect: the demo resets itself to known-good content.
#
# A persistent disk needs a paid instance type. To switch later, set
# `plan: starter` and add:
#
#     disk:
#       name: data
#       mountPath: /data
#       sizeGB: 1
#
# The environment variables below already point at /data, so nothing else
# changes.

services:
  - type: web
    name: admm-demo
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free

    # Closest Render region to Chennai.
    region: singapore

    # Cheap, always 200, and does not touch the database.
    healthCheckPath: /robots.txt

    envVars:
      # The database file and both upload directories live together under one
      # directory, and they have to: a row naming a file is worthless if the
      # file stayed behind somewhere else. With no disk mounted this is just
      # the container's own filesystem, which is exactly what makes the demo
      # reset itself on every restart.
      - key: DATA_DIR
        value: /data
      - key: DATABASE_URI
        value: file:/data/diocese.db

      # Keeps a public copy of a real archdiocese's website out of search
      # results. See src/app/robots.ts.
      - key: DEMO_NOINDEX
        value: '1'

      # Signs login tokens. Generated once by Render and kept, so that a
      # redeploy does not log everyone out.
      - key: PAYLOAD_SECRET
        generateValue: true

      # The administrator, created on first boot by scripts/ensure-admin.ts.
      # The container refuses to start without them, on purpose: with no
      # account and no credentials, Payload would offer its "create the first
      # user" screen to whoever opened /admin first.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # The site's own address, e.g. https://admm-demo.onrender.com — Render
      # only knows it once the service exists. It is read while the pages are
      # being built, so set it and redeploy once, or the sitemap and the
      # structured data on every page will say localhost.
      - key: NEXT_PUBLIC_SERVER_URL
        sync: false
